{% if not has_active_of %}
  {% if is_convertible %}
  <form method="post" action="{% url 'production:convert' q.pk %}" style="display:inline">{% csrf_token %}
    <button type="submit" class="q-btn primary">Converter em OF</button>
  </form>
  {% else %}
  <button type="button" class="q-btn primary" disabled
          title="Aguardando aprovação técnica/comercial">Converter em OF</button>
  <span class="q-hint" style="display:block;font-size:12px;color:var(--g-gray-1);margin-top:4px">
    Aguardando aprovação técnica/comercial
  </span>
  {% endif %}
{% endif %}
