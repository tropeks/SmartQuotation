{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SmartQuotation{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/design-system-g.css' %}">
  <script defer src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <header class="g-rail">
    <span class="brand" aria-label="SMARTQUOTATION">SMART<b>QUOTATION</b></span>
    <span class="spacer"></span>
    {% if user.is_authenticated %}
      <span class="tenant">{{ request.tenant.name|default:"—" }}</span>
      <nav aria-label="Navegação principal" style="display:contents">
        <a class="q-btn" href="{% url 'quotations:list' %}">Cotações</a>
        <a class="q-btn" href="{% url 'production:list' %}">OFs</a>
        <a class="q-btn" href="{% url 'cost_discovery:home' %}">Custos</a>
        <a class="q-btn" href="{% url 'tema_templates:catalog' %}">TEMA</a>
        <a class="q-btn" href="{% url 'tema_templates:data_sheet' %}">Permutador</a>
      </nav>
      <form method="post" action="{% url 'logout' %}" style="display:inline">{% csrf_token %}
        <button class="q-btn">Sair</button></form>
    {% endif %}
  </header>
  <main id="conteudo" class="g-main">{% block content %}{% endblock %}</main>
</body>
</html>
