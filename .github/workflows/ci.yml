name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  pricing-engine:
    name: Motor de custeio (gate -10%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar motor do FEIXE vs gabarito ENGEMATEX (stdlib puro)
        run: python -m tests.validate_feixe_completo
      - name: Validar motor do PERMUTADOR completo (BEU+BEM) vs gabarito (stdlib puro)
        run: python -m tests.validate_permutador_completo

  django-check:
    name: Django check + migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/ci.txt
      - name: Instalar deps de CI
        run: pip install -r requirements/ci.txt
      - name: manage.py check
        env:
          DJANGO_SETTINGS_MODULE: smartquotation.settings.development
        run: python manage.py check
      - name: makemigrations --check (sem migrations pendentes)
        env:
          DJANGO_SETTINGS_MODULE: smartquotation.settings.development
        run: python manage.py makemigrations --check --dry-run

  django-test:
    name: Testes Django (multi-tenant)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smartquotation
          POSTGRES_USER: sq
          POSTGRES_PASSWORD: sq
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U sq -d smartquotation"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/ci.txt
      - name: Instalar deps de CI
        run: pip install -r requirements/ci.txt
      - name: Rodar a suite (TenantTestCase; PDF via chrome é skip no CI)
        env:
          DJANGO_SETTINGS_MODULE: smartquotation.settings.development
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: sq
          POSTGRES_PASSWORD: sq
          POSTGRES_DB: smartquotation
        run: python manage.py test apps -v1
