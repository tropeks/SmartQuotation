name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  pricing-engine:
    name: Motor de custeio (gate -10%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validar motor do FEIXE vs referencial ENGEMATEX (stdlib puro)
        run: python -m tests.validate_feixe_completo
      - name: Validar motor do PERMUTADOR completo (BEU+BEM) vs referencial (stdlib puro)
        run: python -m tests.validate_permutador_completo
      - name: Validar contrato de knobs configuráveis da TenantCostChain (stdlib puro)
        run: python -m tests.test_cost_chain_knobs
      # Régua PARALELA de diagnóstico (não custeia): horas de solda por primeiros
      # princípios, independente do referencial histórico.
      - name: Validar régua de solda por primeiros princípios (stdlib puro)
        run: python -m tests.test_solda_fisica

  ops-tests:
    name: Testes de ops/infra (backup + media volume)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Do lock, com hashes, como todo o resto. Era `pip install pyyaml` solto: a última
      # rota de install sem verificação no repo, logo no job que valida os contratos de
      # backup e de lockfile (um pyyaml comprometido podia fazer este gate mentir).
      - name: Instalar dependências dos testes de ops
        run: pip install --require-hashes -r backend/requirements/ops.lock
      - name: Verificar script de backup (backup_db.sh)
        run: python -m tests.test_backup_script
      - name: Verificar configuração de volume de media
        run: python -m tests.test_media_volume_config
      - name: Verificar backup de media e runbook de restore
        run: python -m tests.test_media_backup
      - name: Verificar contrato default_storage em proposals (geração + download)
        run: python -m tests.test_proposals_storage_contract
      - name: Verificar contrato dos lockfiles de dependência (hashes + drift)
        run: python -m tests.test_requirements_lock

  # Este job existe por causa de uma falha real, não por completude. Em 2026-07-17 uma
  # remediação subiu Django 5.2 -> 5.2.8 para fechar um CVE e declarou o supply chain
  # resolvido. O 5.2.8 já tinha 8 meses e 26 advisories — incluindo PYSEC-2025-109, OUTRO
  # SQLi de FilteredRelation (a MESMA classe de bug que o bump foi fechar), corrigido no
  # 5.2.9. O gate da época era `assert django >= (5,2,8)` em test_requirements_lock: um
  # piso estático, escrito com a versão do dia, que passava verde enquanto o pin envelhecia.
  # Piso estático não detecta pin velho; só uma base de advisories ao vivo detecta.
  # O Dependabot abre o PR de bump, mas nada FORÇA o merge — este job força.
  pip-audit:
    name: pip-audit (CVEs nos locks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # O scanner também vem do lock com hashes: um pip-audit comprometido poderia
      # simplesmente reportar "nenhuma vulnerabilidade".
      - name: Instalar pip-audit (do lock, com hashes)
        run: pip install --require-hashes -r backend/requirements/ops.lock
      # --no-deps: audita exatamente as versões PINADAS no lock (que é o que a imagem de
      # produção instala), em vez de re-resolver a árvore. Falha o job em advisory novo.
      - name: Auditar base.lock (o que produção instala)
        run: pip-audit --no-deps -r backend/requirements/base.lock
      - name: Auditar ci.lock
        run: pip-audit --no-deps -r backend/requirements/ci.lock

  django-check:
    name: Django check + migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/ci.lock
      - name: Instalar deps de CI
        run: pip install --require-hashes -r requirements/ci.lock
      - name: manage.py check
        env:
          DJANGO_SETTINGS_MODULE: smartquotation.settings.development
        run: python manage.py check
      - name: makemigrations --check (sem migrations pendentes)
        env:
          DJANGO_SETTINGS_MODULE: smartquotation.settings.development
        run: python manage.py makemigrations --check --dry-run

  django-test:
    name: Testes Django (multi-tenant)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smartquotation
          POSTGRES_USER: sq
          POSTGRES_PASSWORD: sq
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U sq -d smartquotation"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/ci.lock
      # WeasyPrint liga em pango/gobject via ctypes em tempo de import. Sem estas libs
      # ele não importa, os testes de PDF voltam a virar skip silencioso e a suíte fica
      # verde sem exercitar a geração de proposta.
      - name: Instalar libs de sistema do WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0
      - name: Instalar deps de CI
        run: pip install --require-hashes -r requirements/ci.lock
      # Guarda o guard: se o WeasyPrint parar de importar, queremos falha ruidosa aqui e
      # não 3 testes silenciosamente pulados lá embaixo.
      - name: Verificar que há backend de PDF
        run: python -c "import weasyprint; print('weasyprint', weasyprint.__version__)"
      - name: Rodar a suite (TenantTestCase; PDF via WeasyPrint)
        env:
          DJANGO_SETTINGS_MODULE: smartquotation.settings.development
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: sq
          POSTGRES_PASSWORD: sq
          POSTGRES_DB: smartquotation
        run: python manage.py test apps -v1

  docker-build:
    name: Docker build (valida Dockerfile)
    runs-on: ubuntu-latest
    needs: [django-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -f backend/Dockerfile -t smartquotation-ci:test .
