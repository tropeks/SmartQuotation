name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  pricing-engine:
    name: Motor de custeio (gate -10%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar motor vs gabarito ENGEMATEX (stdlib puro)
        run: python -m tests.validate_feixe_completo

  django-check:
    name: Django check + migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar deps de CI
        run: pip install -r requirements/ci.txt
      - name: manage.py check
        env:
          DJANGO_SETTINGS_MODULE: smartquotation.settings.development
        run: python manage.py check
      - name: makemigrations --check (sem migrations pendentes)
        env:
          DJANGO_SETTINGS_MODULE: smartquotation.settings.development
        run: python manage.py makemigrations --check --dry-run
