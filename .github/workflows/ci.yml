name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  pricing-engine:
    name: Motor de custeio (gate -10%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar motor do FEIXE vs gabarito ENGEMATEX (stdlib puro)
        run: python -m tests.validate_feixe_completo
      - name: Validar motor do PERMUTADOR completo (BEU+BEM) vs gabarito (stdlib puro)
        run: python -m tests.validate_permutador_completo

  ops-tests:
    name: Testes de ops/infra (backup + media volume)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências dos testes de ops
        run: pip install pyyaml
      - name: Verificar script de backup (backup_db.sh)
        run: python -m tests.test_backup_script
      - name: Verificar configuração de volume de media
        run: python -m tests.test_media_volume_config
      - name: Verificar backup de media e runbook de restore
        run: python -m tests.test_media_backup
      - name: Verificar contrato default_storage em proposals (geração + download)
        run: python -m tests.test_proposals_storage_contract
      - name: Verificar contrato dos lockfiles de dependência (hashes + drift)
        run: python -m tests.test_requirements_lock

  django-check:
    name: Django check + migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/ci.lock
      - name: Instalar deps de CI
        run: pip install --require-hashes -r requirements/ci.lock
      - name: manage.py check
        env:
          DJANGO_SETTINGS_MODULE: smartquotation.settings.development
        run: python manage.py check
      - name: makemigrations --check (sem migrations pendentes)
        env:
          DJANGO_SETTINGS_MODULE: smartquotation.settings.development
        run: python manage.py makemigrations --check --dry-run

  django-test:
    name: Testes Django (multi-tenant)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smartquotation
          POSTGRES_USER: sq
          POSTGRES_PASSWORD: sq
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U sq -d smartquotation"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/ci.lock
      - name: Instalar deps de CI
        run: pip install --require-hashes -r requirements/ci.lock
      - name: Rodar a suite (TenantTestCase; PDF via chrome é skip no CI)
        env:
          DJANGO_SETTINGS_MODULE: smartquotation.settings.development
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: sq
          POSTGRES_PASSWORD: sq
          POSTGRES_DB: smartquotation
        run: python manage.py test apps -v1

  docker-build:
    name: Docker build (valida Dockerfile)
    runs-on: ubuntu-latest
    needs: [django-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f backend/Dockerfile -t smartquotation-ci:test .
